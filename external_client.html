<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Agent Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        body {
            background: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center p-8">
    <div class="w-full max-w-2xl">
        <h1 class="text-3xl font-bold mb-6 text-blue-400">Vercel Sandbox Agent Client</h1>

        <div id="chat-container"
            class="glass border border-gray-700 rounded-xl p-6 h-[500px] overflow-y-auto mb-4 space-y-4">
            <div class="text-gray-400 italic">Starting chat...</div>
        </div>

        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="e.g., Run 'ls -la' and tell me what's there"
                class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg transition-all">
                Send
            </button>
        </div>

        <div class="mt-4 text-sm text-gray-500 flex justify-between">
            <span>Sandbox ID: <span id="sandbox-id" class="text-gray-300">None</span></span>
            <button id="clear-btn" class="hover:underline">Clear Chat</button>
        </div>
    </div>

    <script type="module">
        const hostApi = window.location.origin + '/api/chat';
        let sandboxId = null;
        let messages = [];

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sandboxIdSpan = document.getElementById('sandbox-id');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg ${role === 'user' ? 'bg-blue-900/30 ml-8' : 'bg-gray-800/50 mr-8 border border-gray-700'}`;
            div.innerHTML = `<strong>${role === 'user' ? 'You' : 'Agent'}:</strong><div class="mt-1">${text.replace(/\n/g, '<br>')}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);
            messages.push({ role: 'user', text });

            const agentMsgDiv = appendMessage('agent', '...');
            let fullText = '';

            try {
                const response = await fetch(hostApi, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages, sandboxId })
                });

                if (!response.ok) throw new Error('Failed to connect to API');

                const newSandboxId = response.headers.get('x-sandbox-id');
                if (newSandboxId) {
                    sandboxId = newSandboxId;
                    sandboxIdSpan.textContent = sandboxId;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                agentMsgDiv.querySelector('div').innerHTML = '';

                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // keep partial line

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            // AI SDK 6 Agent Stream format is often SSE (data: JSON)
                            const data = line.startsWith('data: ') ? line.substring(6) : line;
                            const part = JSON.parse(data);

                            if (part.type === 'text-delta') {
                                fullText += part.delta;
                                agentMsgDiv.querySelector('div').innerText = fullText;
                            } else if (part.type === 'tool-input-start') {
                                agentMsgDiv.querySelector('div').innerHTML += `<br><span class="text-blue-300 font-mono">[Tool: ${part.toolName}]</span>`;
                            }
                        } catch (e) {
                            // ignore partial/invalid JSON
                        }
                    }
                }

                messages.push({ role: 'assistant', text: fullText });

            } catch (err) {
                console.error(err);
                agentMsgDiv.querySelector('div').innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
            }
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        document.getElementById('clear-btn').onclick = () => {
            chatContainer.innerHTML = '';
            messages = [];
            sandboxId = null;
            sandboxIdSpan.textContent = 'None';
        };
    </script>
</body>

</html>
